<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Helpdesk</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c1a; --muted: #6a675f; --line: #dedbd2;
    --accent: #1f5f4a; --accent-ink: #ffffff; --user: #e7efe9; --bot: #f1efe9; --warn: #8a3b12;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #edebe4; --muted: #a09c91; --line: #34332e;
      --accent: #5fbf9c; --accent-ink: #10231c; --user: #24352d; --bot: #2a2925; --warn: #f0a777;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; min-height: 100%; display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0 12px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 1.25rem; margin: 0; }
  .who { color: var(--muted); font-size: 0.875rem; text-align: right; overflow-wrap: anywhere; }
  button, input { font: inherit; }
  .btn {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 10px 16px; cursor: pointer; font-weight: 600;
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 0.875rem; }
  .btn:focus-visible, .link:focus-visible, input:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #signin { margin: auto 0; padding: 32px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  #signin h2 { margin: 0 0 8px; font-size: 1.125rem; }
  #signin p { margin: 0 0 16px; color: var(--muted); }
  #chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--bot); }
  .msg.note { align-self: center; background: none; color: var(--muted); font-size: 0.875rem; padding: 0; }
  .msg.error { align-self: center; background: none; color: var(--warn); font-size: 0.875rem; padding: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
  .chip { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.875rem; }
  form { display: flex; gap: 8px; padding: 12px 0 4px; border-top: 1px solid var(--line); }
  input[type="text"] { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  footer { color: var(--muted); font-size: 0.8125rem; padding: 8px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Employee Helpdesk</h1>
    <div class="who" id="who" hidden>
      <span id="email"></span><br>
      <button class="link" id="signout" type="button">Sign out</button>
    </div>
  </header>

  <section id="signin" hidden>
    <h2>Sign in to continue</h2>
    <p>One chat for IT problems and HR questions. Your Google email is used to find your tickets and your HR record, so you never have to type it.</p>
    <button class="btn" id="google" type="button">Sign in with Google</button>
    <p id="signin-error" class="msg error" role="alert" hidden></p>
  </section>

  <section id="chat" hidden>
    <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
    <div class="chips" id="chips">
      <button class="chip" type="button">How many days of annual leave do I get?</button>
      <button class="chip" type="button">How many leave days do I have left?</button>
      <button class="chip" type="button">My account is locked out</button>
      <button class="chip" type="button">What is the status of my tickets?</button>
    </div>
    <form id="form" autocomplete="off">
      <label for="text" hidden>Your message</label>
      <input id="text" type="text" placeholder="Type your IT or HR question..." maxlength="2000" required>
      <button class="btn" id="send" type="submit">Send</button>
    </form>
  </section>

  <footer>Demo project. Login by Google through Supabase Auth. Every message is checked on the server before any AI runs.</footer>
</div>

<script>
(function () {
  "use strict";

  // Public settings. No secret lives in this page.
  var SUPABASE_URL = "https://cjcmdddvwrsutdxowglk.supabase.co";
  var CHAT_URL = "https://krishna31.app.n8n.cloud/webhook/helpdesk-secure-chat";
  var PAGE_URL = window.location.origin + window.location.pathname;
  var STORE_KEY = "helpdesk-login";

  var el = function (id) { return document.getElementById(id); };
  var login = null; // { token, expiresAt, email }
  var sessionId = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
  var busy = false;

  function readStore() {
    try { return JSON.parse(window.sessionStorage.getItem(STORE_KEY) || "null"); } catch (e) { return null; }
  }
  function writeStore(value) {
    try {
      if (value) window.sessionStorage.setItem(STORE_KEY, JSON.stringify(value));
      else window.sessionStorage.removeItem(STORE_KEY);
    } catch (e) { /* storage not available: stay signed in for this page view only */ }
  }

  // Shown on screen only. The server never trusts this; it asks Supabase who the token belongs to.
  function emailFromToken(token) {
    try {
      var part = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      var json = decodeURIComponent(Array.prototype.map.call(window.atob(part), function (c) {
        return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(""));
      return JSON.parse(json).email || "";
    } catch (e) { return ""; }
  }

  function takeLoginFromUrl() {
    var hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    var query = new URLSearchParams(window.location.search);
    var problem = hash.get("error_description") || query.get("error_description");
    var token = hash.get("access_token");
    if (token || problem) {
      window.history.replaceState(null, "", PAGE_URL);
    }
    if (problem) {
      showSignIn("Google sign-in did not finish: " + problem);
      return true;
    }
    if (token) {
      var seconds = Number(hash.get("expires_in") || 3600);
      login = { token: token, expiresAt: Date.now() + seconds * 1000, email: emailFromToken(token) };
      writeStore(login);
    }
    return false;
  }

  function showSignIn(message) {
    login = null;
    writeStore(null);
    el("chat").hidden = true;
    el("who").hidden = true;
    el("signin").hidden = false;
    var box = el("signin-error");
    box.hidden = !message;
    box.textContent = message || "";
  }

  function showChat() {
    el("signin").hidden = true;
    el("chat").hidden = false;
    el("who").hidden = false;
    el("email").textContent = login.email ? "Signed in as " + login.email : "Signed in";
    if (!el("log").children.length) {
      addMessage("bot", "Hi, I am the Employee Helpdesk. Ask me about an IT problem or ticket, or an HR question such as leave, pay day or policies.");
    }
    el("text").focus();
  }

  // Builds text safely. Only **bold** is turned into formatting.
  function addMessage(kind, text) {
    var node = document.createElement("div");
    node.className = "msg " + kind;
    String(text).split(/(\*\*[^*]+\*\*)/g).forEach(function (piece) {
      if (/^\*\*[^*]+\*\*$/.test(piece)) {
        var strong = document.createElement("strong");
        strong.textContent = piece.slice(2, -2);
        node.appendChild(strong);
      } else if (piece) {
        node.appendChild(document.createTextNode(piece));
      }
    });
    el("log").appendChild(node);
    el("log").scrollTop = el("log").scrollHeight;
    return node;
  }

  function setBusy(value) {
    busy = value;
    el("send").disabled = value;
    el("text").disabled = value;
  }

  function send(text) {
    text = String(text || "").trim();
    if (!text || busy || !login) return;
    if (Date.now() > login.expiresAt - 30000) {
      showSignIn("Your sign-in has expired. Please sign in again.");
      return;
    }
    addMessage("user", text);
    el("text").value = "";
    var waiting = addMessage("note", "Working on it...");
    setBusy(true);

    var controller = new AbortController();
    var timer = window.setTimeout(function () { controller.abort(); }, 90000);

    // Sent as plain text so the browser makes one simple request.
    window.fetch(CHAT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ access_token: login.token, sessionId: sessionId, chatInput: text }),
      signal: controller.signal
    }).then(function (response) {
      if (response.status === 401) {
        waiting.remove();
        showSignIn("Your sign-in was not accepted. Please sign in again.");
        return null;
      }
      if (!response.ok) throw new Error("The helpdesk returned an error (" + response.status + ").");
      return response.json();
    }).then(function (data) {
      if (!data) return;
      waiting.remove();
      addMessage("bot", data.output || "Sorry, I could not answer that. Please try again.");
    }).catch(function (error) {
      waiting.remove();
      var reason = error && error.name === "AbortError" ? "The helpdesk took too long to answer." : (error && error.message) || "Could not reach the helpdesk.";
      addMessage("error", reason + " Please try again.");
    }).finally(function () {
      window.clearTimeout(timer);
      setBusy(false);
      if (login) el("text").focus();
    });
  }

  el("google").addEventListener("click", function () {
    window.location.href = SUPABASE_URL + "/auth/v1/authorize?provider=google&redirect_to=" + encodeURIComponent(PAGE_URL);
  });
  el("signout").addEventListener("click", function () {
    el("log").textContent = "";
    showSignIn("");
  });
  el("form").addEventListener("submit", function (event) {
    event.preventDefault();
    send(el("text").value);
  });
  el("chips").addEventListener("click", function (event) {
    if (event.target && event.target.classList.contains("chip")) send(event.target.textContent);
  });

  var failed = takeLoginFromUrl();
  if (!failed) {
    if (!login) {
      var saved = readStore();
      if (saved && saved.token && saved.expiresAt > Date.now() + 30000) login = saved;
    }
    if (login) showChat(); else showSignIn("");
  }
})();
</script>
</body>
</html>
